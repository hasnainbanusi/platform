apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: platform
  labels:
    app: platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
    spec:
      containers:
        - name: platform
          image: ghcr.io/hasnainbanusi/platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
